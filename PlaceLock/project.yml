name: PlaceLock
options:
  bundleIdPrefix: com.nsimon
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: R6W24T35J6 # free Personal Team -> blocking is simulated. See Roadmap.md to switch.
    CODE_SIGN_STYLE: Automatic
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.55.6 # stays on 2.x; v3 renames several APIs
targets:
  PlaceLock:
    type: application
    platform: iOS
    sources: [PlaceLock]
    dependencies:
      - package: Supabase
        product: Supabase
    # Paid team: uncomment to request the Screen Time (Family Controls) entitlement.
    # entitlements:
    #   path: PlaceLock/PlaceLock.entitlements
    #   properties:
    #     com.apple.developer.family-controls: true
    info:
      path: PlaceLock/Info.plist
      properties:
        CFBundleDisplayName: PlaceLock
        UILaunchScreen: {}
        UIBackgroundModes: [location]
        # Backup and sync (Sync/SyncEngine.swift). The publishable key is meant to ship in apps:
        # row-level security, not the key, protects the data. Remove both to turn sync off.
        SupabaseURL: https://bdbyvdfugetapjysoiml.supabase.co
        SupabaseKey: sb_publishable_i-zjtTV_7B-8THYGmG2agA_9XXez0BI
        NSLocationWhenInUseUsageDescription: PlaceLock checks that you're at one of your allowed places before unblocking apps.
        NSLocationAlwaysAndWhenInUseUsageDescription: PlaceLock needs Always access so it can lock your apps again when you leave an allowed place, even if the app is closed.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nsimon.PlaceLock
        # Paid team: change to "$(inherited) SCREEN_TIME" to use real Screen Time blocking.
        # Set here (not project-wide) so $(inherited) keeps DEBUG in Debug builds.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited)"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
    scheme:
      testTargets: [PlaceLockTests]
  PlaceLockTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PlaceLockTests]
    dependencies:
      - target: PlaceLock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nsimon.PlaceLockTests
        GENERATE_INFOPLIST_FILE: YES
