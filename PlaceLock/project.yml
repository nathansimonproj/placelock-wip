name: PlaceLock
options:
  bundleIdPrefix: com.nsimon
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: R6W24T35J6 # free Personal Team -> blocking is simulated. project-paid.yml switches it.
    CODE_SIGN_STYLE: Automatic
    # The version people see on the App Store, and the build number. Every upload needs a higher
    # build number. Raise them with scripts/bump-build.sh rather than by hand. Both Info.plists
    # read these, so the Shield extension always matches the app.
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.55.6 # stays on 2.x; v3 renames several APIs
targets:
  PlaceLock:
    type: application
    platform: iOS
    sources:
      - path: PlaceLock
        excludes: [PrivacyInfo.xcprivacy] # listed below, so it's always a resource
      # Privacy manifest: tracking, collected data and required-reason APIs. Keep it matching
      # docs/app-store/data-inventory.md. The Shield extension has its own (project-paid.yml).
      - path: PlaceLock/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: Supabase
        product: Supabase
    # Real Screen Time blocking (entitlements, App Group, extensions) is in project-paid.yml.
    info:
      path: PlaceLock/Info.plist
      properties:
        CFBundleDisplayName: Spots
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Export compliance: the only encryption is HTTPS (Supabase over URLSession), which is exempt.
        # Saying so here skips App Store Connect's encryption question on every upload.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIBackgroundModes: [location]
        # Backup and sync (Sync/SyncEngine.swift). The publishable key is meant to ship in apps:
        # row-level security, not the key, protects the data. Remove both to turn sync off.
        SupabaseURL: https://bdbyvdfugetapjysoiml.supabase.co
        SupabaseKey: sb_publishable_i-zjtTV_7B-8THYGmG2agA_9XXez0BI
        NSLocationWhenInUseUsageDescription: Spots checks that you're at one of your allowed places before unblocking apps.
        NSLocationAlwaysAndWhenInUseUsageDescription: Spots needs Always access so it can lock your apps again when you leave an allowed place, even if the app is closed.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nsimon.PlaceLock
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor # Assets.xcassets; Shared/Brand.swift mirrors it
        # project-paid.yml adds SCREEN_TIME here for real Screen Time blocking.
        # Set here (not project-wide) so $(inherited) keeps DEBUG in Debug builds.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited)"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
    scheme:
      testTargets: [PlaceLockTests]
  PlaceLockTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PlaceLockTests]
    dependencies:
      - target: PlaceLock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nsimon.PlaceLockTests
        GENERATE_INFOPLIST_FILE: YES
