# Real Screen Time blocking (paid Apple Developer team). Generate with:
#   xcodegen generate --spec project-paid.yml
# Plain `xcodegen generate` builds the free version (simulated blocking) from project.yml.
#
# This file includes project.yml and only adds to it. Its values win over project.yml's, and
# lists (like dependencies) are appended.
include:
  - project.yml

settings:
  base:
    DEVELOPMENT_TEAM: R6W24T35J6 # paid Apple Developer Program team (same ID as the old Personal Team)

targets:
  PlaceLock:
    entitlements:
      path: PlaceLock/PlaceLock.entitlements
      properties: &screenTimeEntitlements
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.nsimon.PlaceLock] # SharedStore.appGroup
    dependencies:
      - target: PlaceLockShield
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) SCREEN_TIME"

  # The block screen: "Instagram is blocked · Unblocks at Gym, Soccer Field or Home".
  PlaceLockShield:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/Shield
        excludes: [PrivacyInfo.xcprivacy] # listed below, so it's always a resource
      - PlaceLock/Shared
      - path: Extensions/Shield/PrivacyInfo.xcprivacy # the extension's own privacy manifest
        buildPhase: resources
    entitlements:
      path: Extensions/Shield/Shield.entitlements
      properties: *screenTimeEntitlements
    info:
      path: Extensions/Shield/Info.plist
      properties:
        CFBundleDisplayName: Spots Shield
        # Same version and build as the app (project.yml); App Store Connect rejects a mismatch.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
    settings:
      base: &extensionSettings
        PRODUCT_BUNDLE_IDENTIFIER: com.nsimon.PlaceLock.Shield
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) SCREEN_TIME"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
